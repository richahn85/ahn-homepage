<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お問い合わせ受付 | 安永燦</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{
  --paper:#F4F7FB;
  --paper-2:#FFFFFF;
  --ink:#12263F;
  --ink-2:#42556E;
  --seal:#1558A8;
  --line:#D3DEEB;
  --serif:var(--sans);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:32px;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  line-height:1.7;
}
main{
  width:min(640px,100%);
  border:1px solid var(--line);
  background:var(--paper-2);
  padding:40px 34px;
}
.eyebrow{
  margin-bottom:14px;
  color:var(--seal);
  font-size:.78rem;
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
}
h1{
  margin:0 0 16px;
  font-family:var(--serif);
  font-size:clamp(1.9rem,6vw,2.6rem);
  line-height:1.35;
}
p{margin:0 0 24px;color:var(--ink-2)}
a{
  display:inline-block;
  padding:13px 22px;
  background:var(--seal);
  color:#fff;
  text-decoration:none;
  font-weight:700;
}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Submission received</div>
  <h1>お問い合わせ<br>ありがとうございます。</h1>
  <p>内容を確認のうえ、1営業日以内（韓国時間）にメールでご連絡いたします。</p>
  <a href="/ja/">ホームへ戻る</a>
</main>
</body>
</html>
